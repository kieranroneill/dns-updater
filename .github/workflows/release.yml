name: 'Release'

on:
  push:
    branches:
      - beta
      - main

jobs:
  release:
    name: 'Release'
    permissions:
      contents: write # to be able to publish a github release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: '🦫 Setup Golang'
        uses: ./.github/actions/use-go-dependencies
      - name: '🔧 Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: '🔖 Release'
        env:
          # appears on the release commits
          GIT_AUTHOR_NAME: kieranroneill
          GIT_AUTHOR_EMAIL: hello@kieranoneill.com
          GIT_COMMITTER_NAME: kieranroneill
          GIT_COMMITTER_EMAIL: hello@kieranoneill.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --package semantic-release \
              --package @semantic-release/changelog \
              --package @semantic-release/commit-analyzer \
              --package @semantic-release/exec \
              --package @semantic-release/git \
              --package @semantic-release/github \
              --package @semantic-release/release-notes-generator \
              semantic-release
