name: 'Use Dependencies'

description: 'Checks if the Go binaries have been cached with the hash of the all the Makefile.'

runs:
  using: 'composite'
  steps:
    - name: '🦫 Setup Golang'
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
    - name: '💾 Cache modules'
      uses: actions/cache@v4
      id: cache-modules
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-mod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-
    - name: '💾 Cache tools'
      uses: actions/cache@v4
      id: cache-tools
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('Makefile') }}
        restore-keys: |
          ${{ runner.os }}-go-bin-
    - name: '📦 Install modules'
      if: steps.cache-modules.outputs.cache-hit != 'true'
      run: |
        make install_modules
      shell: bash
    - name: '📦 Install tools'
      if: steps.cache-tools.outputs.cache-hit != 'true'
      run: |
        make install_tools
      shell: bash
